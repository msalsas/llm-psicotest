name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (PYTHONHASHSEED=0)
        env:
          PYTHONPATH: src
        run: PYTHONHASHSEED=0 python3 -m unittest discover -s tests -v
      - name: Run tests (PYTHONHASHSEED=1)
        env:
          PYTHONPATH: src
        run: PYTHONHASHSEED=1 python3 -m unittest discover -s tests -v
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
